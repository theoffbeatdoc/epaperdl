name: Daily ePaper Delivery

on:
  schedule:
    - cron: "45 1-17 * * *"  # every hour from 7:15 AM IST to 11:15 PM IST
  workflow_dispatch:   # manual trigger from GitHub Actions UI

permissions:
  contents: write      # needed to commit epaper_log.json back to repo


jobs:
  deliver-epapers:
    name: Scrape & Deliver ePapers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch with a token so we can push the log back
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run delivery script ───────────────────────────────────────────────
      - name: Deliver ePapers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python epaper_delivery.py

      # ── 5. Commit updated log ────────────────────────────────────────────────
      - name: Commit log file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epaper_log.json
          # Only commit if the file actually changed
          git diff --staged --quiet || \
            git commit -m "chore: update ePaper log [skip ci]"
          git push